<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOAP Transcriber — RS Sansani</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0a4d7c;--blue-dark:#083f66;--blue-light:#e8f2fa;
  --teal:#0e9a8e;--teal-light:#e6f7f6;
  --white:#ffffff;--gray-50:#f8fafc;--gray-100:#f1f5f9;
  --gray-200:#e2e8f0;--gray-300:#cbd5e1;--gray-400:#94a3b8;
  --gray-500:#64748b;--gray-700:#334155;--gray-900:#0f172a;
  --red:#dc2626;--red-light:#fef2f2;
  --amber:#d97706;--amber-light:#fffbeb;
  --S:#0a4d7c;--O:#7c3aed;--A:#c2410c;--P:#0e9a8e;
  --r:8px;
}
html,body{
  min-height:100vh;background:var(--gray-50);color:var(--gray-900);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.55;
}

/* NAV */
nav{
  height:64px;background:var(--blue);
  display:flex;align-items:center;padding:0 28px;gap:14px;
  position:sticky;top:0;z-index:10;
  box-shadow:0 2px 6px rgba(0,0,0,0.25);
}
.nav-logo{height:36px;width:auto;object-fit:contain;filter:brightness(0) invert(1);}
.nav-logo-err{
  height:36px;display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:-.3px;
}
.nav-divider{width:1px;height:24px;background:rgba(255,255,255,.2);}
.nav-title{font-size:15px;font-weight:500;color:rgba(255,255,255,.92);letter-spacing:-.1px;}
.nav-sub{font-size:12px;color:rgba(255,255,255,.45);margin-left:auto;}

/* LAYOUT */
.main{
  max-width:1160px;margin:0 auto;
  padding:24px 24px 48px;
  display:grid;grid-template-columns:1fr 1fr;gap:20px;
}
@media(max-width:740px){.main{grid-template-columns:1fr;}}

/* PANEL */
.panel{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.panel-head{
  padding:14px 20px;border-bottom:1px solid var(--gray-200);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--gray-50);
}
.panel-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-500);}
.panel-meta{font-size:12px;color:var(--gray-400);}
.panel-body{padding:24px;}

/* RECORD */
.rec-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0 24px;}
.rec-btn{
  width:88px;height:88px;border-radius:50%;
  border:2px solid var(--gray-300);background:var(--gray-100);
  cursor:pointer;outline:none;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.rec-btn:hover{border-color:var(--blue);background:var(--blue-light);}
.rec-btn.on{border-color:var(--red);background:var(--red-light);animation:rp 2s ease-in-out infinite;}
@keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.14)}50%{box-shadow:0 0 0 14px rgba(220,38,38,0)}}
.rec-dot{width:26px;height:26px;border-radius:50%;background:var(--blue);transition:all .15s;}
.rec-btn.on .rec-dot{background:var(--red);border-radius:5px;width:20px;height:20px;}

.rec-txt{text-align:center;}
.rec-state{font-size:13px;color:var(--gray-500);}
.rec-state.on{color:var(--red);}
.rec-time{font-size:36px;font-weight:300;letter-spacing:3px;color:var(--gray-700);font-variant-numeric:tabular-nums;margin-top:4px;}
.rec-time.on{color:var(--red);}

.wave{display:flex;align-items:center;gap:3px;height:32px;opacity:0;transition:opacity .25s;}
.wave.on{opacity:1;}
.wb{width:3px;border-radius:2px;background:var(--red);height:3px;transition:height .09s ease;opacity:.65;}

/* DIVIDER LABEL */
.dlabel{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;
  color:var(--gray-400);display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.dlabel::before,.dlabel::after{content:'';flex:1;height:1px;background:var(--gray-200);}

/* TRANSCRIPT */
.tx{
  border:1px solid var(--gray-200);border-radius:var(--r);
  background:var(--gray-50);padding:14px 16px;
  min-height:200px;max-height:280px;overflow-y:auto;
  font-size:14px;line-height:1.8;color:var(--gray-700);
  white-space:pre-wrap;word-break:break-word;
  scrollbar-width:thin;scrollbar-color:var(--gray-300) transparent;
}
.tx:empty::before{content:'Transkrip percakapan muncul real-time saat perekaman...';color:var(--gray-400);font-style:italic;}
.interim{color:var(--gray-400);font-style:italic;}

/* BUTTONS */
.brow{display:grid;grid-template-columns:100px 1fr;gap:10px;margin-top:14px;}
.btn{
  padding:11px 18px;border-radius:var(--r);font-size:14px;font-weight:500;
  cursor:pointer;border:1px solid transparent;outline:none;transition:all .12s;text-align:center;
}
.btn-ghost{background:transparent;border-color:var(--gray-200);color:var(--gray-500);}
.btn-ghost:hover{background:var(--gray-100);border-color:var(--gray-300);}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-blue:hover:not(:disabled){background:var(--blue-dark);}
.btn-blue:disabled{background:var(--gray-200);border-color:var(--gray-200);color:var(--gray-400);cursor:not-allowed;}
.btn-blue.loading{background:var(--gray-400);border-color:var(--gray-400);animation:bl 1.1s ease-in-out infinite;}
@keyframes bl{0%,100%{opacity:.5}50%{opacity:1}}

/* LANG */
.langs{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px;}
.lang{font-size:11px;padding:3px 10px;border-radius:99px;background:var(--teal-light);color:var(--teal);border:1px solid rgba(14,154,142,.2);}

/* ALERT */
.alert{border-radius:var(--r);padding:11px 14px;font-size:13px;line-height:1.5;margin-bottom:12px;display:none;border:1px solid transparent;}
.alert.err{background:var(--red-light);border-color:rgba(220,38,38,.2);color:var(--red);display:block;}
.alert.warn{background:var(--amber-light);border-color:rgba(217,119,6,.2);color:var(--amber);display:block;}

/* SOAP EMPTY */
.sempty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:12px;padding:24px;}
.sempty-mark{font-size:48px;font-weight:300;letter-spacing:10px;color:var(--gray-200);}
.sempty-txt{font-size:14px;color:var(--gray-400);text-align:center;line-height:1.9;}

/* SOAP BLOCKS */
.sb{
  padding:20px 22px;border-bottom:1px solid var(--gray-200);
  opacity:0;transform:translateY(5px);
  transition:opacity .3s ease,transform .3s ease;
}
.sb:last-child{border-bottom:none;}
.sb.show{opacity:1;transform:none;}
.sb:nth-child(1){transition-delay:.03s}.sb:nth-child(2){transition-delay:.09s}
.sb:nth-child(3){transition-delay:.15s}.sb:nth-child(4){transition-delay:.21s}
.sb[data-s="S"]{border-left:3px solid var(--S);}
.sb[data-s="O"]{border-left:3px solid var(--O);}
.sb[data-s="A"]{border-left:3px solid var(--A);}
.sb[data-s="P"]{border-left:3px solid var(--P);}
.sb-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.sb-icon{
  width:36px;height:36px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
}
.sb[data-s="S"] .sb-icon{background:rgba(10,77,124,.07);color:var(--S);}
.sb[data-s="O"] .sb-icon{background:rgba(124,58,237,.07);color:var(--O);}
.sb[data-s="A"] .sb-icon{background:rgba(194,65,12,.07);color:var(--A);}
.sb[data-s="P"] .sb-icon{background:rgba(14,154,142,.07);color:var(--P);}
.sb-word{font-size:14px;font-weight:600;color:var(--gray-900);}
.sb-desc{font-size:11.5px;color:var(--gray-400);margin-top:1px;}
.sb-text{font-size:14px;line-height:1.85;color:var(--gray-700);white-space:pre-wrap;}

/* COPY */
.copy-btn{
  display:none;margin:0 22px 20px;
  padding:10px;border-radius:var(--r);
  background:transparent;border:1px solid var(--gray-200);
  color:var(--gray-500);font-size:13px;font-weight:500;
  cursor:pointer;transition:all .12s;width:calc(100% - 44px);
}
.copy-btn:hover{background:var(--gray-100);border-color:var(--gray-300);color:var(--gray-700);}
.copy-btn.visible{display:block;}

/* STATUS */
.statusbar{max-width:1160px;margin:0 auto;padding:0 24px 28px;}
.sb-inner{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--r);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--gray-400);
}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex-shrink:0;}
.sdot.err{background:var(--red);}.sdot.warn{background:var(--amber);}
.sright{margin-left:auto;font-size:12px;color:var(--gray-400);}

::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:2px;}
</style>
</head>
<body>

<nav>
  <img class="nav-logo" src="https://www.rssansani.co.id/assets/img/logo.webp"
    onerror="this.style.display='none';document.getElementById('lf').style.display='flex';" alt="RS Sansani">
  <div class="nav-logo-err" id="lf" style="display:none">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
    RS Sansani
  </div>
  <div class="nav-divider"></div>
  <span class="nav-title">SOAP Transcriber</span>
  <span class="nav-sub">Penggunaan Internal</span>
</nav>

<div class="main">

  <!-- KIRI: REKAM -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Rekam Percakapan</span>
      <span class="panel-meta" id="recInd">Siap</span>
    </div>
    <div class="panel-body">
      <div id="alertBox"></div>
      <div class="rec-area">
        <button class="rec-btn" id="recBtn" onclick="toggleRecord()">
          <div class="rec-dot" id="recDot"></div>
        </button>
        <div class="rec-txt">
          <div class="rec-state" id="recState">Tekan untuk mulai merekam</div>
          <div class="rec-time" id="recTime">00:00</div>
        </div>
        <div class="wave" id="wave"></div>
      </div>

      <div class="dlabel">Transkrip</div>
      <div class="tx" id="txBox"></div>

      <div class="brow">
        <button class="btn btn-ghost" onclick="clearAll()">Reset</button>
        <button class="btn btn-blue" id="analyzeBtn" onclick="analyzeSOAP()" disabled>Analisis → SOAP</button>
      </div>

      <div class="langs">
        <span class="lang">Indonesia</span>
        <span class="lang">English</span>
        <span class="lang">Jawa</span>
        <span class="lang">Minang</span>
        <span class="lang">Batak</span>
      </div>
    </div>
  </div>

  <!-- KANAN: SOAP -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Format SOAP</span>
      <span class="panel-meta" id="soapStatus">Menunggu analisis</span>
    </div>
    <div id="soapWrap">
      <div class="sempty">
        <div class="sempty-mark">SOAP</div>
        <div class="sempty-txt">Rekam percakapan dokter–pasien<br>lalu tekan <strong>Analisis → SOAP</strong></div>
      </div>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copySOAP()">⎘ Salin Hasil SOAP</button>
  </div>

</div>

<div class="statusbar">
  <div class="sb-inner">
    <div class="sdot" id="sdot"></div>
    <span id="smsg">Sistem siap</span>
    <span class="sright" id="tokenInfo"></span>
  </div>
</div>

<script>
let recognition=null,isRecording=false,timerRef=null,waveRef=null;
let seconds=0,finalTx='',interimTx='',wBars=[],lastSOAP=null;

(function(){
  const wf=document.getElementById('wave');
  for(let i=0;i<26;i++){const b=document.createElement('div');b.className='wb';wf.appendChild(b);wBars.push(b);}
  if(!window.SpeechRecognition&&!window.webkitSpeechRecognition)
    showAlert('Gunakan Google Chrome atau Microsoft Edge untuk fitur perekaman.','err');
})();

function animW(){wBars.forEach(b=>{b.style.height=(Math.random()*24+4)+'px';b.style.opacity=.45+Math.random()*.5;});}

function buildRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR();r.continuous=true;r.interimResults=true;r.lang='id-ID';
  r.onresult=e=>{
    interimTx='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalTx+=t+' ';else interimTx=t;
    }
    renderTx();updEst();
    document.getElementById('analyzeBtn').disabled=finalTx.trim().length<15;
  };
  r.onerror=e=>{
    if(e.error==='not-allowed'){showAlert('Akses mikrofon ditolak. Izinkan di browser.','err');stopRec();}
    else if(e.error==='network'){showAlert('Web Speech API memerlukan koneksi internet.','warn');}
  };
  r.onend=()=>{if(isRecording){try{r.start()}catch(e){}}};
  return r;
}

function renderTx(){
  const b=document.getElementById('txBox');b.innerHTML='';
  if(finalTx){const s=document.createElement('span');s.textContent=finalTx;b.appendChild(s);}
  if(interimTx){const s=document.createElement('span');s.className='interim';s.textContent=interimTx;b.appendChild(s);}
  b.scrollTop=b.scrollHeight;
}

function updEst(){
  const w=finalTx.trim().split(/\s+/).length,tI=Math.round(w*1.4)+300,tO=400;
  document.getElementById('tokenInfo').textContent=`~${tI} token · est. $${(((tI/1e6)*3)+((tO/1e6)*15)).toFixed(4)}/call`;
}

function toggleRecord(){if(isRecording)stopRec();else startRec();}

function startRec(){
  clearAlert();recognition=buildRec();if(!recognition)return;
  try{recognition.start();}catch(e){showAlert('Gagal akses mikrofon: '+e.message,'err');return;}
  isRecording=true;seconds=0;
  document.getElementById('recBtn').classList.add('on');
  document.getElementById('recDot').style.cssText='background:var(--red);border-radius:5px;width:20px;height:20px';
  document.getElementById('recState').textContent='Merekam...';
  document.getElementById('recState').classList.add('on');
  document.getElementById('recTime').classList.add('on');
  document.getElementById('recInd').textContent='● REC';
  document.getElementById('recInd').style.color='var(--red)';
  document.getElementById('wave').classList.add('on');
  setSt('Merekam percakapan...','');
  timerRef=setInterval(()=>{seconds++;document.getElementById('recTime').textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;},1000);
  waveRef=setInterval(animW,110);
}

function stopRec(){
  if(recognition){recognition.onend=null;try{recognition.stop()}catch(e){}recognition=null;}
  isRecording=false;clearInterval(timerRef);clearInterval(waveRef);
  document.getElementById('recBtn').classList.remove('on');
  document.getElementById('recDot').style.cssText='background:var(--blue);border-radius:50%;width:26px;height:26px';
  document.getElementById('recState').textContent='Rekaman selesai';
  document.getElementById('recState').classList.remove('on');
  document.getElementById('recTime').classList.remove('on');
  document.getElementById('recInd').textContent='Selesai';
  document.getElementById('recInd').style.color='var(--gray-400)';
  document.getElementById('wave').classList.remove('on');
  wBars.forEach(b=>b.style.height='3px');
  const ok=finalTx.trim().length>=15;
  document.getElementById('analyzeBtn').disabled=!ok;
  setSt(ok?'Siap dianalisis':'Transkrip terlalu pendek','');
}

function clearAll(){
  if(isRecording)stopRec();
  finalTx='';interimTx='';lastSOAP=null;seconds=0;
  document.getElementById('txBox').innerHTML='';
  document.getElementById('recTime').textContent='00:00';
  document.getElementById('recState').textContent='Tekan untuk mulai merekam';
  document.getElementById('recInd').textContent='Siap';
  document.getElementById('recInd').style.color='var(--gray-400)';
  document.getElementById('analyzeBtn').disabled=true;
  document.getElementById('tokenInfo').textContent='';
  document.getElementById('soapStatus').textContent='Menunggu analisis';
  document.getElementById('copyBtn').classList.remove('visible');
  document.getElementById('soapWrap').innerHTML=`<div class="sempty"><div class="sempty-mark">SOAP</div><div class="sempty-txt">Rekam percakapan dokter–pasien<br>lalu tekan <strong>Analisis → SOAP</strong></div></div>`;
  clearAlert();setSt('Sistem siap','');
}

async function analyzeSOAP(){
  const tx=finalTx.trim();
  if(tx.length<15){showAlert('Transkrip terlalu pendek.','warn');return;}
  const btn=document.getElementById('analyzeBtn');
  btn.disabled=true;btn.classList.add('loading');btn.textContent='Menganalisis...';
  document.getElementById('soapStatus').textContent='Memproses...';
  setSt('Mengirim ke Claude...','');
  document.getElementById('soapWrap').innerHTML=`<div class="sempty"><div class="sempty-mark" style="opacity:.25">SOAP</div><div class="sempty-txt">Sedang menganalisis transkrip...</div></div>`;

  const SYS=`Kamu adalah asisten medis RS Sansani Pekanbaru yang mengkonversi transkrip percakapan dokter-pasien menjadi SOAP note.
Transkrip mungkin dalam bahasa Indonesia, Inggris, atau campuran bahasa daerah (Minang, Jawa, Batak). Transkripsi otomatis sering tidak sempurna — interpretasikan dari konteks medis.
Kembalikan HANYA JSON ini tanpa teks lain: {"S":"...","O":"...","A":"...","P":"..."}
- S: Keluhan utama, onset, durasi, riwayat penyakit sekarang.
- O: Tanda vital, pemeriksaan fisik, lab. Jika tidak ada tulis "Tidak disebutkan."
- A: Diagnosis kerja atau kesan klinis.
- P: Resep, dosis, durasi, edukasi, rujukan, follow-up.
Gunakan Bahasa Indonesia baku dan terminologi medis tepat.`;

  try{
    const resp=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1000,system:SYS,messages:[{role:'user',content:`Transkrip:\n\n${tx}`}]})});
    if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${resp.status}`);}
    const data=await resp.json();
    const raw=data.content.find(b=>b.type==='text')?.text||'';
    let soap;
    try{soap=JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch(e){throw new Error('Format respons tidak valid.');}
    lastSOAP=soap;renderSOAP(soap);
    const u=data.usage;
    if(u)document.getElementById('tokenInfo').textContent=`${u.input_tokens} in · ${u.output_tokens} out · $${(((u.input_tokens/1e6)*3)+((u.output_tokens/1e6)*15)).toFixed(4)}`;
    document.getElementById('soapStatus').textContent='Selesai';setSt('Analisis selesai','');
  }catch(err){
    showAlert('Gagal: '+err.message,'err');
    document.getElementById('soapWrap').innerHTML=`<div class="sempty"><div class="sempty-txt">Analisis gagal.<br><small>${err.message}</small></div></div>`;
    document.getElementById('soapStatus').textContent='Error';setSt('Gagal','err');
  }finally{btn.disabled=false;btn.classList.remove('loading');btn.textContent='Analisis → SOAP';}
}

const META={S:{w:'Subjective',d:'Keluhan & Riwayat Pasien'},O:{w:'Objective',d:'Temuan Objektif'},A:{w:'Assessment',d:'Diagnosis / Kesan Klinis'},P:{w:'Plan',d:'Rencana Tatalaksana'}};

function renderSOAP(soap){
  const html=['S','O','A','P'].map(k=>`
    <div class="sb" data-s="${k}">
      <div class="sb-head">
        <div class="sb-icon">${k}</div>
        <div><div class="sb-word">${META[k].w}</div><div class="sb-desc">${META[k].d}</div></div>
      </div>
      <div class="sb-text">${esc(soap[k]||'—')}</div>
    </div>`).join('');
  document.getElementById('soapWrap').innerHTML=html;
  requestAnimationFrame(()=>{document.querySelectorAll('.sb').forEach(el=>{requestAnimationFrame(()=>el.classList.add('show'));});});
  document.getElementById('copyBtn').classList.add('visible');
}

function copySOAP(){
  if(!lastSOAP)return;
  const txt=['S','O','A','P'].map(k=>`[${k} - ${META[k].w}]\n${lastSOAP[k]||'—'}`).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const b=document.getElementById('copyBtn');b.textContent='✓ Tersalin!';
    setTimeout(()=>b.textContent='⎘ Salin Hasil SOAP',2000);
  }).catch(()=>showAlert('Gagal menyalin.','warn'));
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showAlert(m,t){document.getElementById('alertBox').innerHTML=`<div class="alert ${t}">${m}</div>`;}
function clearAlert(){document.getElementById('alertBox').innerHTML='';}
function setSt(m,t){document.getElementById('smsg').textContent=m;const d=document.getElementById('sdot');d.className='sdot'+(t==='err'?' err':t==='warn'?' warn':'');}
</script>
</body>
</html>
